version: '3'

info:
  companyName: "HTTiny"
  productName: "HTTiny"
  productIdentifier: "dev.claudioguevara.httiny"
  description: "A tiny, focused HTTP client for developers."
  copyright: "Copyright 2026 HTTiny"
  comments: "Dark, fast and frictionless HTTP tooling."
  version: "0.35.9"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 800
  ignore:
    dir: [.git, node_modules, frontend, bin]
    file: [.DS_Store, .gitignore]
    watched_extension: ["*.go"]
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    # Before Vite starts: the frontend imports the generated bindings, so they have
    # to be on disk for the very first dev build.
    - cmd: wails3 task common:generate:bindings
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations:
